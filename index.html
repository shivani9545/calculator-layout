<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="clc.css">
   
</head>
<body>
    <div class="calculator">
        <div id="display">
            <input type="text" name="screen" id="screen">
        </div>
        <div class="buttons">
        
            <button>AC</button>
            <button>sqrt</button>
            <button>%</button>
            <button class="col">/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="col">*</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="col">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="col">+</button>
            <button>0</button>
            <button>.</button>
            <button>Back</button>
            <button class="col">=</button>
            
        </div>
    </div>
    <script src="script.js"></script>
</body> 
</html>
